[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-chat-api"
version = "0.1.0"
description = "Authenticated, streaming chat API (auth + sessions + SSE + history persistence)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.9",
    "ruff>=0.4",
]
anthropic = [
    "anthropic>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP006/UP035 (prefer builtin `list`/`dict` over typing.List/Dict) are
# intentionally ignored in models.py: SQLModel's relationship() needs the
# typing.List[...] form to resolve forward refs correctly with this
# SQLAlchemy version — `list[...]` there raises at import time.
ignore = ["UP006", "UP035", "UP042"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
ignore_missing_imports = true
